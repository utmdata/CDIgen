<script>
    // Function to clear the options in the select element
    function clearSelectOptions() {
    var select = document.getElementById("cdSelect");
    var options = select.getElementsByTagName('option');
    // Loop through all options and remove them except for the "Unknown" option
    for (var i = options.length - 1; i >= 0; i--) {
        if (options[i].value !== "UNKNOWN") {
            select.removeChild(options[i]);
        }
    }
}
</script>

                                <script>
                                    let valoresUnicos = new Set();
                                    let valoresSeleccionados = new Set();
                                    let valoresEliminados = new Set();
                                    let csvContent = "";

                                    function procesarCSV(data) {
                                        const todasFilas = data.split(/\r?\n|\r/);
                                        valoresUnicos.clear();

                                        let instrumentIndex;
                                        for (const fila of todasFilas) {
                                            if (!fila || !fila.trim()) continue; // Skip empty rows
                                            
                                            const celdas = fila.includes(',') ? fila.split(',') : fila.split(';');

                                            if (celdas.length >= 8) instrumentIndex = 6;
                                            else if (celdas.length >= 6) instrumentIndex = 4;
                                            else if (celdas.length >= 5) instrumentIndex = 3;

                                            if (
                                                instrumentIndex !== undefined &&
                                                celdas[instrumentIndex] !== undefined &&
                                                celdas[instrumentIndex].trim()
                                            ) {
                                                const valor = celdas[instrumentIndex].trim();
                                                if (valor && valor !== '') {
                                                    valoresUnicos.add(valor);
                                                    console.log("Instruments:", valor);
                                                }
                                            }
                                        }

                                        console.log("Unic instruments:", Array.from(valoresUnicos));
                                        if (valoresUnicos.size === 0) {
                                            alert('No instruments found in the CSV file. Please check the file format.');
                                            return;
                                        }
                                        valoresSeleccionados = new Set(valoresUnicos);
                                        mostrarListas();
                                    }

                                    function actualizarCampoOculto() {
                                        const hiddenInput = document.getElementById("instrumentos_seleccionados");
                                        hiddenInput.value = Array.from(valoresSeleccionados).join(',');
                                        console.log("Campo oculto actualizado con:", hiddenInput.value);
                                    }

                                    function mostrarListas() {
                                        const contenedor = document.getElementById('contenedor-lista');
                                        contenedor.innerHTML = "";

                                        const contenedorDisponibles = document.getElementById('contenedor-disponibles');
                                        contenedorDisponibles.innerHTML = "";

                                        valoresSeleccionados.forEach(valor => {
                                            const item = document.createElement('div');
                                            item.className = "item-valor";
                                            item.innerHTML = `
                                                <span>${valor}</span>
                                                <button class="eliminar-valor" type="button" title="Delete">
                                                    <img src="static/img/minus.png" style="width: 16px; height: 16px;">
                                                </button>
                                            `;

                                            item.querySelector('.eliminar-valor').addEventListener('click', (e) => {
                                                e.preventDefault();
                                                valoresSeleccionados.delete(valor);
                                                valoresEliminados.add(valor);
                                                mostrarListas();
                                            });

                                            contenedor.appendChild(item);
                                        });

                                        valoresEliminados.forEach(valor => {
                                            const item = document.createElement('div');
                                            item.className = "item-disponible";
                                            item.innerHTML = `
                                                <span>${valor}</span>
                                                <button class="recuperar-valor" type="button" title="Restore">
                                                    <img src="static/img/add.png" style="width: 16px; height: 16px;">
                                                </button>
                                            `;

                                            item.querySelector('.recuperar-valor').addEventListener('click', (e) => {
                                                e.preventDefault();
                                                valoresEliminados.delete(valor);
                                                valoresSeleccionados.add(valor);
                                                mostrarListas();
                                            });

                                            contenedorDisponibles.appendChild(item);
                                        });

                                        actualizarCampoOculto();
                                    }

                                    function CSVToJSON(csv) {
                                        const lines = csv.split('\n').filter(line => line.trim() !== '');
                                        const result = [];

                                        const startIndex = 0;

                                        for (let i = startIndex; i < lines.length; i++) {
                                            const currentLine = lines[i].split(',');

                                            if (currentLine.length >= 5 && currentLine.some(cell => cell.trim() !== '')) {
                                                const obj = {};

                                                for (let j = 0; j < currentLine.length; j++) {
                                                    obj[`col_${j}`] = currentLine[j].trim();
                                                }

                                                result.push(obj);
                                            }
                                        }

                                        return JSON.stringify(result);
                                    }

                                    // Evento change para el input de archivo
                                    const archivoInput = document.querySelector('.archivo');
                                    archivoInput.addEventListener('change', function (evt) {
                                        const file = evt.target.files[0];
                                        const reader = new FileReader();
                                        reader.onload = function (e) {
                                            csvContent = e.target.result;
                                            const jsonData = CSVToJSON(csvContent);
                                            procesarCSV(csvContent);
                                            console.log(jsonData);

                                            // Send the JSON data to the server (relative path)
                                            fetch('upload_json', {
                                                method: 'POST',
                                                headers: {
                                                    'Content-Type': 'application/json'
                                                },
                                                body: JSON.stringify(jsonData)
                                            })
                                                .then(response => {
                                                    if (response.ok) {
                                                        console.log('JSON data uploaded successfully');
                                                        document.getElementById('csvFileSelected').value = 'true';
                                                    } else {
                                                        console.error('Failed to upload JSON data');
                                                        document.getElementById('csvFileSelected').value = 'false';
                                                    }
                                                })
                                                .catch(error => {
                                                    console.error('Error uploading JSON data:', error);
                                                    document.getElementById('csvFileSelected').value = 'false';
                                                });
                                        };
                                        reader.readAsText(file);
                                    });
                                </script>

        <script>
            function fetchCsrCodeList() {
                // Add loading class to the button to change cursor
                document.getElementById("fetchButton").classList.add("loading");

                // Perform the fetch operation (use relative path so app prefix is preserved)
                fetch("fetch_csr_code_list")
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! Status: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(responseText => {
                        alert(responseText);  // You can handle the response here

                        // Remove the loading class after the fetch operation is complete
                        document.getElementById("fetchButton").classList.remove("loading");
                    })
                    .catch(error => {
                        console.error("Fetch error:", error);

                        // Remove the loading class if an error occurs during the fetch operation
                        document.getElementById("fetchButton").classList.remove("loading");
                    });
            }

            // Function to handle form submission
            function handleSubmit(event) {
                // Check if CSV file has been selected and processed
                const selectedInstruments = document.getElementById('instrumentos_seleccionados').value.trim();
                const csvFileInput = document.getElementById('miInput');
                
                console.log("Form submission check:");
                console.log("CSV file selected:", csvFileInput && csvFileInput.files && csvFileInput.files.length > 0);
                console.log("Selected instruments:", selectedInstruments);
                console.log("instrumentos_seleccionados field value:", document.getElementById('instrumentos_seleccionados').value);
                
                if (!csvFileInput || !csvFileInput.files || csvFileInput.files.length === 0) {
                    event.preventDefault();
                    alert('Please select a CSV file first.');
                    return false;
                }

                if (!selectedInstruments) {
                    event.preventDefault();
                    alert('Please select at least one instrument from the CSV file.');
                    return false;
                }
                
                console.log("Form validation passed. Submitting with instruments:", selectedInstruments);
                // Show the overlay with the loading spinner
                document.getElementById("overlay").style.display = "block";
            }

            // Attach the event listener to the form
            document.getElementById("survey-form").addEventListener("submit", handleSubmit);

        </script>
